<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Orbit 是一个基于 Vue 3、Vite、TypeScript、Pinia、Axios 与 vue-i18n 的现代化前端工程示例。"
    />
    <meta name="theme-color" content="#f6f5f1" />
    <!-- iOS ignores the manifest icons, so the PNG below and these flags are required. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Orbit</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash of the wrong color scheme.
      ;(() => {
        try {
          const mode = localStorage.getItem('orbit.theme.v1')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = mode === 'dark' || ((!mode || mode === 'system') && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch {
          // Storage and matchMedia may be unavailable in hardened browser contexts.
        }
      })()
    </script>
    <style>
      /*
       * Static first-paint skeleton. It is painted before the entry bundle is
       * parsed, so FCP no longer waits for Vue; `main.ts` mounts over it.
       *
       * Rules: layout-only (no copy that would need i18n), same tokens as the
       * app, and no animation, so the swap cannot cause extra layout work.
       */
      html,
      body {
        margin: 0;
        background: oklch(0.975 0.005 85);
      }
      html.dark,
      html.dark body {
        background: oklch(0.17 0.012 260);
      }
      .boot {
        --boot-card: oklch(0.995 0.003 85);
        --boot-muted: oklch(0.95 0.007 85);
        --boot-border: oklch(0.89 0.008 85);
        min-height: 100dvh;
        background: oklch(0.975 0.005 85);
        box-sizing: border-box;
      }
      html.dark .boot {
        --boot-card: oklch(0.205 0.014 260);
        --boot-muted: oklch(0.26 0.016 260);
        --boot-border: oklch(0.31 0.018 260);
        background: oklch(0.17 0.012 260);
      }
      .boot__bar {
        display: flex;
        height: 64px;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        border-bottom: 1px solid var(--boot-border);
      }
      .boot__logo {
        width: 108px;
        height: 14px;
        border-radius: 999px;
        background: var(--boot-muted);
      }
      .boot__pill {
        width: 96px;
        height: 32px;
        margin-left: auto;
        border-radius: 999px;
        background: var(--boot-muted);
      }
      .boot__body {
        display: grid;
        gap: 20px;
        padding: 24px;
        max-width: 1200px;
      }
      @media (min-width: 1024px) {
        .boot__body {
          padding: 32px 32px 32px 320px;
        }
      }
      .boot__hero {
        height: 132px;
        border: 1px solid var(--boot-border);
        border-radius: 20px;
        background: var(--boot-card);
      }
      .boot__card {
        display: grid;
        gap: 12px;
        padding: 20px;
        border: 1px solid var(--boot-border);
        border-radius: 20px;
        background: var(--boot-card);
      }
      .boot__row {
        height: 44px;
        border-radius: 12px;
        background: var(--boot-muted);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-hidden="true" data-testid="boot-skeleton">
        <div class="boot__bar">
          <span class="boot__logo"></span>
          <span class="boot__pill"></span>
        </div>
        <div class="boot__body">
          <div class="boot__hero"></div>
          <div class="boot__card">
            <span class="boot__row"></span>
            <span class="boot__row"></span>
            <span class="boot__row"></span>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">请启用 JavaScript 以使用 Orbit 工作台。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
